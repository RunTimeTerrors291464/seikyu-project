name: Deploy to EC2

on:
  push:
    branches:
      - backend-v2

jobs:
  deploy:
    name: SSH Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_BACKEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY_BACKEND }}
          port: 22
          script: |
            set -e

            # Load nvm and node into PATH for non-interactive SSH sessions
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$PATH:/usr/local/bin:/usr/bin"

            cd ${{ secrets.EC2_PROJECT_PATH_BACKEND }}

            echo "--- Pulling latest code ---"
            git pull origin backend-v2

            echo "--- Installing dependencies (including dev for build) ---"
            npm ci

            echo "--- Building project ---"
            npm run build

            echo "--- Running database migrations ---"
            npm run migration:run

            echo "--- Restarting PM2 app ---"
            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production

            echo "--- Deploy complete ---"
            pm2 status
